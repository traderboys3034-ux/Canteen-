<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sainik Canteen - Admin Panel</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#07110c;
      color:#fff;
    }
    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }
    .card{
      background:#101c15;
      border:1px solid rgba(212,175,55,.35);
      border-radius:18px;
      padding:22px;
      margin-bottom:20px;
    }
    h1,h2{color:#e0b93f}
    input,textarea,select{
      width:100%;
      padding:13px;
      margin:7px 0 14px;
      border-radius:9px;
      border:1px solid #45624d;
      background:#07110c;
      color:#fff;
      font-size:15px;
    }
    textarea{min-height:100px;resize:vertical}
    button{
      border:0;
      border-radius:9px;
      padding:12px 18px;
      font-weight:bold;
      cursor:pointer;
      margin:4px;
    }
    .gold{background:#d4af37;color:#07110c}
    .red{background:#b83232;color:white}
    .green{background:#159447;color:white}
    .hidden{display:none}
    .product{
      border:1px solid rgba(212,175,55,.25);
      border-radius:14px;
      padding:15px;
      margin:12px 0;
      background:#0b1710;
    }
    .product img{
      width:100px;
      height:100px;
      object-fit:cover;
      border-radius:10px;
      margin-bottom:10px;
    }
    .logout{
      float:right;
      background:#b83232;
      color:white;
    }
    .status{
      padding:10px;
      border-radius:8px;
      margin:10px 0;
      background:#14261a;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h1>🇮🇳 Sainik Canteen</h1>
    <h2>Admin Login</h2>

    <label>Username</label>
    <input id="username" type="text" placeholder="Username">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button class="gold" onclick="login()">LOGIN</button>

    <div id="loginError"></div>
  </div>

  <!-- ADMIN -->
  <div id="adminPanel" class="hidden">

    <div class="card">
      <button class="logout" onclick="logout()">Logout</button>
      <h1>Admin Panel</h1>
      <p>Sainik Canteen Bikram</p>
      <div id="status" class="status">Firebase connected</div>
    </div>

    <!-- ADD PRODUCT -->
    <div class="card">
      <h2>Add Product</h2>

      <label>Product Name</label>
      <input id="productName" placeholder="Example: Samsung Smart TV">

      <label>Category</label>
      <select id="productCategory">
        <option value="Electronics">Electronics</option>
        <option value="Home Appliances">Home Appliances</option>
        <option value="Mobile">Mobile</option>
        <option value="TV">TV</option>
        <option value="Refrigerator">Refrigerator</option>
        <option value="Other">Other</option>
      </select>

      <label>Price</label>
      <input id="productPrice" type="number" placeholder="Example: 29999">

      <label>Image URL</label>
      <input id="productImage" placeholder="https://example.com/product.jpg">

      <label>Description</label>
      <textarea id="productDescription" placeholder="Product details"></textarea>

      <button class="green" onclick="addProduct()">ADD PRODUCT</button>
    </div>

    <!-- PRODUCT LIST -->
    <div class="card">
      <h2>Product List</h2>
      <div id="productList">Loading products...</div>
    </div>

  </div>
</div>

<script type="module">

  import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import { db } from "./firebase.js";

  window.login = function(){

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;

    if(username === "canteen" && password === "Bikram"){

      sessionStorage.setItem("canteenAdmin","true");

      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("adminPanel").classList.remove("hidden");

      loadProducts();

    }else{

      document.getElementById("loginError").innerHTML =
        "<p style='color:#ff6b6b'>Wrong username or password.</p>";

    }
  };


  window.logout = function(){

    sessionStorage.removeItem("canteenAdmin");

    location.reload();

  };


  window.addProduct = async function(){

    const name =
      document.getElementById("productName").value.trim();

    const category =
      document.getElementById("productCategory").value;

    const price =
      document.getElementById("productPrice").value;

    const image =
      document.getElementById("productImage").value.trim();

    const description =
      document.getElementById("productDescription").value.trim();


    if(!name || !price){

      alert("Product name and price are required.");
      return;

    }


    try{

      await addDoc(collection(db,"products"),{

        name:name,
        category:category,
        price:Number(price),
        image:image,
        description:description,
        createdAt:serverTimestamp()

      });


      alert("Product added successfully ✅");


      document.getElementById("productName").value="";
      document.getElementById("productPrice").value="";
      document.getElementById("productImage").value="";
      document.getElementById("productDescription").value="";


      loadProducts();

    }catch(error){

      console.error(error);

      alert(
        "Product add nahi hua.\n\n" +
        error.message
      );

    }

  };


  window.loadProducts = async function(){

    const list =
      document.getElementById("productList");

    list.innerHTML="Loading...";


    try{

      const snapshot =
        await getDocs(collection(db,"products"));


      if(snapshot.empty){

        list.innerHTML =
          "<p>No products found.</p>";

        return;

      }


      list.innerHTML="";


      snapshot.forEach((item)=>{

        const p=item.data();


        const div=document.createElement("div");

        div.className="product";


        div.innerHTML=`

          ${
            p.image
            ? `<img src="${p.image}" alt="${p.name}">`
            : ""
          }

          <h3>${p.name || ""}</h3>

          <p>
            <b>Category:</b>
            ${p.category || ""}
          </p>

          <p>
            <b>Price:</b>
            ₹${p.price || 0}
          </p>

          <p>
            ${p.description || ""}
          </p>

          <button
            class="red"
            onclick="deleteProduct('${item.id}')">
            DELETE
          </button>

        `;


        list.appendChild(div);

      });


    }catch(error){

      console.error(error);

      list.innerHTML =
        "<p style='color:#ff6b6b'>" +
        error.message +
        "</p>";

    }

  };


  window.deleteProduct = async function(id){

    if(!confirm("Delete this product?")) return;


    try{

      await deleteDoc(
        doc(db,"products",id)
      );

      alert("Product deleted ✅");

      loadProducts();

    }catch(error){

      alert(error.message);

    }

  };


  // Keep login after page refresh
  if(sessionStorage.getItem("canteenAdmin")==="true"){

    document.getElementById("loginBox").classList.add("hidden");

    document.getElementById("adminPanel").classList.remove("hidden");

    loadProducts();

  }

</script>

</body>
</html>
